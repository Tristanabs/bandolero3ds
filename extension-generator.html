<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bandolero 3DS - Generador .ban3</title>
  <style>
    :root { color-scheme: dark; --red:#be192d; --panel:#192137; --cyan:#44d2e0; }
    * { box-sizing: border-box; }
    body { margin:0; font:16px system-ui,sans-serif; background:#0e1322; color:#f4f7ff; }
    header { background:var(--red); padding:22px clamp(20px,6vw,80px); }
    main { max-width:900px; margin:28px auto; padding:0 20px; }
    form { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:16px; }
    label { display:flex; flex-direction:column; gap:6px; }
    input, textarea, button { border:1px solid #46516b; border-radius:5px; padding:10px; font:inherit; }
    input, textarea { background:var(--panel); color:inherit; }
    textarea { min-height:110px; grid-column:1/-1; }
    .colors { display:flex; flex-wrap:wrap; gap:18px; grid-column:1/-1; }
    .colors input { padding:2px; width:70px; height:42px; }
    button { background:var(--cyan); color:#071018; border:0; cursor:pointer; font-weight:700; }
    pre { background:#080c16; padding:16px; overflow:auto; border-radius:5px; }
    .hint { color:#aab4ca; }
    .store { margin:34px 0; padding:20px; background:#11182a; border:1px solid #2d3853; border-radius:8px; }
    .catalog { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; }
    .card { padding:14px; background:var(--panel); border-radius:6px; }
    .card h3 { margin:0 0 8px; color:var(--cyan); }
    .card p { min-height:42px; color:#aab4ca; }
    .card a { display:inline-block; padding:8px 12px; background:var(--cyan); color:#071018; border-radius:4px; font-weight:700; text-decoration:none; }
    .card a.disabled { opacity:.45; pointer-events:none; }
  </style>
</head>
<body>
  <header><strong>Bandolero 3DS</strong> · Generador de extensiones .ban3</header>
  <main>
    <p class="hint">Genera un manifiesto de dato seguro. La aplicación lo lee desde
      <code>sdmc:/3ds/bandolero/extensions/</code>; no se permite ni se ejecuta código.</p>
    <section class="store" id="store">
      <h2>Tienda de extensiones</h2>
      <p class="hint">Catálogo manual: cada entrada enlaza a un archivo .ban3 publicado por su autor.</p>
      <div class="catalog" id="catalog"></div>
    </section>
    <form id="generator">
      <label>ID<input id="id" required pattern="[A-Za-z0-9._\-]+" value="mi-extension"></label>
      <label>Nombre visible<input id="name" required value="Mi extensión"></label>
      <label>Extensión de archivo<input id="extension" placeholder=".md" value=".ban"></label>
      <label>Tema<input id="theme" value="Personalizado"></label>
      <div class="colors">
        <label>Fondo<input id="background" type="color" value="#0e1322"></label>
        <label>Panel<input id="panel" type="color" value="#192137"></label>
        <label>Rojo<input id="accent" type="color" value="#be192d"></label>
        <label>Texto<input id="text" type="color" value="#f4f7ff"></label>
        <label>Cian<input id="cyan" type="color" value="#44d2e0"></label>
      </div>
      <textarea id="description" placeholder="Descripción opcional"></textarea>
      <button type="submit">Descargar extensión .ban3</button>
    </form>
    <h2>Vista previa</h2>
    <pre id="preview"></pre>
  </main>
  <script>
    const $ = id => document.getElementById(id);
    const fields = ['id','name','extension','theme','background','panel','accent','text','cyan','description'];
    function manifest() {
      return fields.map(key => `${key}=${$(key).value.replace(/[\r\n]/g, ' ')}`).join('\n') + '\n';
    }
    function update() { $('preview').textContent = manifest(); }
    function catalogManifest(item) {
      return [
        `id=${item.id}`, `name=${item.name}`, `extension=.ban`,
        `theme=${item.theme}`, `background=${item.background}`,
        `panel=${item.panel}`, `accent=${item.accent}`,
        `text=#f4f7ff`, `cyan=${item.cyan}`, `description=${item.description}`
      ].join('\n') + '\n';
    }
    const extensionCatalog = [
      {id:'aurora', name:'Aurora Boreal', description:'Tema azul nocturno con acentos verdes.', theme:'Aurora Boreal', background:'#071b2b', panel:'#123b52', accent:'#48e0b2', cyan:'#65d9ff'},
      {id:'arcade', name:'Arcade Sunset', description:'Colores retro para sesiones de código.', theme:'Arcade Sunset', background:'#24102e', panel:'#472052', accent:'#ff5f8f', cyan:'#ffc857'},
      {id:'forest', name:'Bosque Pixel', description:'Paleta verde de alto contraste.', theme:'Bosque Pixel', background:'#0b2118', panel:'#16452d', accent:'#a6e22e', cyan:'#5de4c7'},
      {id:'ocean', name:'Océano Profundo', description:'Interfaz fría y relajada para escribir.', theme:'Océano Profundo', background:'#07152d', panel:'#102c55', accent:'#4f8cff', cyan:'#63e6ff'},
      {id:'ember', name:'Brasa', description:'Tema cálido inspirado en una consola retro.', theme:'Brasa', background:'#29110b', panel:'#512216', accent:'#ff7043', cyan:'#ffd166'}
    ];
    function renderCatalog() {
      $('catalog').innerHTML = extensionCatalog.map(item => {
        return `<article class="card"><h3>${item.name}</h3><p>${item.description}</p>` +
          `<button type="button" data-extension="${item.id}">Descargar .ban3</button></article>`;
      }).join('');
      document.querySelectorAll('[data-extension]').forEach(button => {
        button.addEventListener('click', () => {
          const item = extensionCatalog.find(entry => entry.id === button.dataset.extension);
          const blob = new Blob([catalogManifest(item)], {type:'text/plain;charset=utf-8'});
          const link = document.createElement('a');
          link.href = URL.createObjectURL(blob);
          link.download = `${item.id}.ban3`;
          link.click();
          URL.revokeObjectURL(link.href);
        });
      });
    }
    fields.forEach(key => $(key).addEventListener('input', update));
    $('generator').addEventListener('submit', event => {
      event.preventDefault();
      if (!$('generator').reportValidity()) return;
      const blob = new Blob([manifest()], {type:'text/plain;charset=utf-8'});
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `${$('id').value}.ban3`;
      link.click();
      URL.revokeObjectURL(link.href);
    });
    update();
    renderCatalog();
  </script>
</body>
</html>
